overwrite: true
schema: './schema.json'
documents: 'src/graphql/operations/**/*.gql'
hooks:
  afterAllFileWrite:
    - prettier --write
generates:
  src/graphql/generated.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-graphql-request'
    config:
      onlyOperationTypes: true
      scalars:
        Address: string
        DateTime: string
        JSON: unknown
